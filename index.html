"3×3×2＝18通り","exp":"18通りです。","check":"2けた目以降は0も使える。"},{"lv":"★","q":"さいころを2回ふります。目の和が5になる出方は何通り？","choices":["3通り","4通り","5通り","6通り"],"answer":1,"hint":"(1,4)から書こう。","formula":"(1,4),(2,3),(3,2),(4,1)＝4通り","exp":"順番を区別して4通りです。","check":"(1,4)と(4,1)は別。"},{"lv":"★★","q":"さいころを2回ふります。目の和が7になる出方は何通り？","choices":["5通り","6通り","7通り","12通り"],"answer":1,"hint":"1回目1〜6を順に。","formula":"6通り","exp":"(1,6)から(6,1)まで6通りです。","check":"もれなく順番に調べる。"},{"lv":"★★","q":"0・1・5・8から3枚で3けたの5の倍数を作ります。何通り？","choices":["6通り","8通り","10通り","12通り"],"answer":2,"hint":"一の位0と5。","formula":"6＋4＝10通り","exp":"一の位0なら6、一の位5なら4、計10通りです。","check":"場合分け。"},{"lv":"★★","q":"1・2・3・4・5から3枚で3けたの整数を作ります。百の位が一の位より大きいものは何通り？","choices":["15通り","20通り","30通り","60通り"],"answer":2,"hint":"全60通りの半分。","formula":"5×4×3÷2＝30通り","exp":"百の位と一の位を入れ替えると大小が逆になるので30通りです。","check":"対になるものを利用。"},{"lv":"★★★","q":"さいころを3回ふります。目の和が6になる出方は何通り？","choices":["6通り","10通り","12通り","15通り"],"answer":1,"hint":"1,1,4 / 1,2,3 / 2,2,2。","formula":"3＋6＋1＝10通り","exp":"3種類の組の並び方を足して10通りです。","check":"組→並びの2段階。"},{"lv":"★★★","q":"0・1・2・5・8から3枚で、5の倍数かつ偶数の3けたの整数は何通り？","choices":["8通り","10通り","12通り","16通り"],"answer":2,"hint":"一の位は0だけ。","formula":"4×3＝12通り","exp":"一の位0、百の位4通り、十の位3通りで12通りです。","check":"2条件の共通部分を先に決める。"}]}],"challenge":[{"title":"STEP 6 樹形図・表で整理","sub":"もれなく、重複なく数える","questions":[{"lv":"中受★","q":"赤・青・黄の3色から2色を順に選びます。同じ色は続けて選べません。何通り？","choices":["3通り","6通り","8通り","9通り"],"answer":1,"hint":"1回目から枝を3本、各枝から2本。","formula":"3×2＝6通り","exp":"1回目3通り、それぞれ2回目は残り2色なので6通りです。","check":"樹形図の各段が何を表すか言える？"},{"lv":"中受★","q":"AからBへ行く道が2本、BからCへ行く道が3本あります。A→B→Cの行き方は何通り？","choices":["5通り","6通り","8通り","9通り"],"answer":1,"hint":"A→Bの各道から3本ずつ枝分かれ。","formula":"2×3＝6通り","exp":"2本それぞれに3通りが続くので6通りです。","check":"道順も樹形図で考えられる。"},{"lv":"中受★★","q":"1・2・3・4から2枚を順に取り出します。1枚目より2枚目の数字が大きい取り出し方は何通り？","choices":["4通り","6通り","8通り","12通り"],"answer":1,"hint":"始めの数字ごとに枝を数える。","formula":"3＋2＋1＋0＝6通り","exp":"1の後は3通り、2の後は2通り、3の後は1通り。計6通りです。","check":"枝ごとの数が違うときは足し算。"}]},{"title":"STEP 7 さいころ2回・3回","sub":"表・組・順番を使い分ける","questions":[{"lv":"中受★","q":"さいころを2回ふります。目の和が8になる出方は何通り？","choices":["4通り","5通り","6通り","8通り"],"answer":1,"hint":"(2,6)から順に。","formula":"(2,6),(3,5),(4,4),(5,3),(6,2)＝5通り","exp":"順番を区別して5通りです。","check":"2回なら表でも整理できる。"},{"lv":"中受★★","q":"さいころを2回ふります。目の積が12になる出方は何通り？","choices":["2通り","4通り","6通り","8通り"],"answer":1,"hint":"1〜6の範囲で12になる組。","formula":"(2,6),(3,4),(4,3),(6,2)＝4通り","exp":"順番込みで4通りです。","check":"目は1〜6。"},{"lv":"中受★★★","q":"さいころを3回ふります。目の和が7になる出方は何通り？","choices":["10通り","12通り","15通り","18通り"],"answer":2,"hint":"1,1,5 / 1,2,4 / 1,3,3 / 2,2,3。","formula":"3＋6＋3＋3＝15通り","exp":"各組の並べ方を足して15通りです。","check":"同じ数の個数で並べ方が変わる。"}]},{"title":"STEP 8 条件付きの場合の数","sub":"ちょうど・少なくとも・含む","questions":[{"lv":"中受★","q":"1・2・3・4から3枚を並べます。1を必ず使う並べ方は何通り？","choices":["6通り","12通り","18通り","24通り"],"answer":2,"hint":"1の場所を3通り。","formula":"3×3×2＝18通り","exp":"1の場所3通り、残り2か所は3×2通りなので18通りです。","check":"必ず使うものを先に固定。"},{"lv":"中受★★","q":"1・2・3・4・5から3枚を並べます。1と2のうち、ちょうど一方だけを使う並べ方は何通り？","choices":["18通り","24通り","36通り","48通り"],"answer":2,"hint":"1だけ、2だけに分ける。","formula":"2×(3×3×2)＝36通り","exp":"1だけで18通り、2だけでも18通り。合計36通りです。","check":"重ならない場合を足す。"},{"lv":"中受★★★","q":"A・B・C・D・Eの5人から3人を選びます。Aを必ず含む選び方は何通り？","choices":["4通り","6通り","8通り","10通り"],"answer":1,"hint":"A以外から2人。","formula":"4×3÷2＝6通り","exp":"残り4人から2人を選ぶので6通りです。","check":"必須の人を先に固定。"}]},{"title":"STEP 9 選んでから並べる","sub":"選び方と並べ方の複合","questions":[{"lv":"中受★","q":"5人から3人を選び、その3人を一列に並べます。何通り？","choices":["30通り","60通り","90通り","120通り"],"answer":1,"hint":"1番目・2番目・3番目を決める。","formula":"5×4×3＝60通り","exp":"順番付きで3人を選ぶので60通りです。","check":"選ぶ＋並べるをまとめて考える。"},{"lv":"中受★★","q":"6人から3人のチームを選び、その中からキャプテンを1人決めます。何通り？","choices":["30通り","60通り","90通り","120通り"],"answer":1,"hint":"キャプテンを先に決める。","formula":"6×(5×4÷2)＝60通り","exp":"キャプテン6通り、残りから仲間2人10通り。計60通りです。","check":"特別な役割を先に決める。"},{"lv":"中受★★★","q":"数字1・2・3・4・5から3枚を選んで3けたの偶数を作ります。何通り？","choices":["18通り","24通り","30通り","36通り"],"answer":1,"hint":"一の位は2か4。","formula":"2×4×3＝24通り","exp":"一の位2通り、百の位4通り、十の位3通りで24通りです。","check":"条件の位を先に決める。"}]},{"title":"STEP 10 余事象と実戦","sub":"全部から引く考え方を身につける","questions":[{"lv":"中受★★","q":"1・2・3・4の4枚をすべて並べます。1と2がとなり合わない並べ方は何通り？","choices":["8通り","10通り","12通り","16通り"],"answer":2,"hint":"全部24通りから、となり合う場合を引く。","formula":"24－(6×2)＝12通り","exp":"全部24通り。1と2をひとかたまりと見ると3つを並べる6通りで、かたまりの中は12・21の2通り。となり合うのは12通りなので、24－12＝12通りです。","check":"〜でない、は全部から引けないか考える。"},{"lv":"中受★★","q":"さいころを2回ふります。少なくとも1回は6が出る出方は何通り？","choices":["6通り","10通り","11通り","12通り"],"answer":2,"hint":"36通りから6が1回も出ない場合を引く。","formula":"36－5×5＝11通り","exp":"全部36通り。6が出ない25通りを引いて11通りです。","check":"少なくとも1回は補集合が便利。"},{"lv":"中受★★★","q":"さいころを3回ふります。3回の目の和が13になる出方は何通り？","choices":["18通り","21通り","24通り","27通り"],"answer":1,"hint":"1,6,6 / 2,5,6 / 3,4,6 / 3,5,5 / 4,4,5。","formula":"3＋6＋6＋3＋3＝21通り","exp":"和13になる5種類の組の並べ方を足すと21通りです。","check":"組をもれなく探し、並べ方を数える。"}]}]}, KEY='kazu-complete-v2';
const fresh=()=>({basic:{cleared:[],wrong:{},best:{}},practice:{cleared:[],wrong:{},best:{}},challenge:{cleared:[],wrong:{},best:{}}});let P=fresh();try{P=Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let S={screen:'home',course:null,setNo:null,qi:0,selected:null,checked:false,hint:false,formula:false,score:0,wrong:[],review:false,finished:false};const app=document.getElementById('app');const save=()=>localStorage.setItem(KEY,JSON.stringify(P));const sets=()=>DATA[S.course];const qs=()=>S.setNo===null?[]:(S.review?(P[S.course].wrong[S.setNo]||[]).map(n=>({...sets()[S.setNo].questions[n],original:n})):sets()[S.setNo].questions);
function reset(){S.qi=0;S.selected=null;S.checked=false;S.hint=false;S.formula=false;S.score=0;S.wrong=[];S.finished=false}function home(){S={...S,screen:'home',course:null,setNo:null,review:false};reset();render()}function openCourse(c){S.course=c;S.setNo=null;S.screen='course';S.review=false;reset();render()}function courseHome(){S.screen='course';S.setNo=null;S.review=false;reset();render()}function openSet(n,r=false){S.setNo=n;S.review=r;S.screen='quiz';reset();render()}
function canOpen(n){return S.course!=='challenge'||n===0||P.challenge.cleared.includes(n-1)||P.challenge.cleared.includes(n)}
function render(){if(S.screen==='home')return renderHome();if(S.screen==='course')return renderCourse();if(S.finished)return renderResult();return renderQuiz()}
function renderHome(){app.innerHTML=`<main class="wrap"><header class="hero"><div style="font-size:48px">📚</div><b style="color:#047857">中学受験 算数</b><h1>場合の数 完全トレーニング</h1><p class="muted">苦手を克服！ わかる → 解ける → 得意に変える！</p></header><button class="card course" onclick="openCourse('basic')"><div style="font-size:32px">📗</div><h2>1. 基本編 STEP1〜5</h2><span class="muted">まず考え方を理解する</span></button><button class="card course" onclick="openCourse('practice')"><div style="font-size:32px">✏️</div><h2>2. 演習編 STEP1〜5</h2><span class="muted">全40問。★から★★★へ反復して定着</span></button><button class="card course" onclick="openCourse('challenge')"><div style="font-size:32px">🎓</div><h2>3. 中受チャレンジ STEP6〜10</h2><span class="muted">樹形図、さいころ、条件付き、複合、余事象、実戦へ</span></button><div class="box violet"><b>おうちルール：</b>答える前に紙へ式を書く。答え合わせの後に「なぜ？」を1回説明する。</div></main>`}
function renderCourse(){const A=sets(),D=P[S.course];const title=S.course==='basic'?'📗 基本編':S.course==='practice'?'✏️ 問題演習編':'🎓 中受チャレンジ';app.innerHTML=`<main class="wrap"><button class="btn" onclick="home()">⌂ コース選択</button><header style="padding:20px 0"><h1>${title}</h1><p class="muted">${S.course==='practice'?'数字や題材が変わっても解ける力をつけよう。':S.course==='challenge'?'中学受験で使う整理・場合分け・複合思考へ。':'まずは「なぜ？」を理解しよう。'}</p></header>${A.map((a,n)=>{const lock=!canOpen(n),done=D.cleared.includes(n),wc=(D.wrong[n]||[]).length;return`<div class="card ${lock?'locked':''}"><button class="step" ${lock?'disabled':''} onclick="openSet(${n})"><span class="bubble ${done?'done':''}">${done?'✓':lock?'🔒':S.course==='challenge'?n+6:n+1}</span><span class="grow"><b style="font-size:19px">${a.title}</b><br><span class="muted">${a.sub}</span><br><small class="muted">ベスト ${D.best[n]||0} / ${a.questions.length}</small></span><b>›</b></button>${wc?`<button class="btn amber" style="margin-top:12px" onclick="openSet(${n},true)">↻ 間違いだけ復習（${wc}問）</button>`:''}</div>`}).join('')}</main>`}
function renderQuiz(){const A=qs(),q=A[S.qi],pct=(S.qi+(S.checked?1:0))/A.length*100;app.innerHTML=`<main class="wrap"><button class="btn" onclick="courseHome()">⌂ STEP一覧</button><div class="top" style="margin-top:15px"><div><b style="color:#047857">${S.review?'復習：':''}${sets()[S.setNo].title}</b><h2>${q.lv}　問題 ${S.qi+1}</h2></div><b>${S.qi+1} / ${A.length}</b></div><div class="bar"><div style="width:${pct}%"></div></div><section class="card"><h2>${q.q}</h2><div class="box" style="background:#f8fafc"><b>① 読む　② 紙に式を書く　③ 答える</b></div><div class="choices">${q.choices.map((c,j)=>`<button class="choice ${S.checked?(j===q.answer?'good':S.selected===j?'bad':''):S.selected===j?'sel':''}" ${S.checked?'disabled':''} onclick="pick(${j})">${c}</button>`).join('')}</div>${!S.checked?`<div class="row"><button class="btn amber" onclick="toggleHint()">💡 ヒント</button><button class="btn primary" ${S.selected===null?'disabled style="opacity:.4"':''} onclick="checkAnswer()">答え合わせ</button></div>${S.hint?`<div class="box amber"><b>ヒント：</b>${q.hint}</div>`:''}`:`<div class="box ${S.selected===q.answer?'good':'bad'}"><b>${S.selected===q.answer?'✓ 正解！':'△ おしい！'}</b>${S.selected!==q.answer?`<p>正解は「${q.choices[q.answer]}」です。</p>`:''}</div><button class="btn sky" style="margin-top:14px" onclick="toggleFormula()">式の立て方を見る</button>${S.formula?`<div class="box sky"><b>式・考え方</b><h3>${q.formula}</h3></div>`:''}<div class="box" style="background:#f8fafc"><b>📘 解説</b><p>${q.exp}</p></div><div class="box violet"><b>★ 定着チェック</b><p><b>${q.check}</b></p></div><button class="btn primary wide" onclick="nextQ()">${S.qi===A.length-1?'結果を見る':'次の問題へ →'}</button>`}</section></main>`}
function pick(j){S.selected=j;render()}function toggleHint(){S.hint=!S.hint;render()}function toggleFormula(){S.formula=!S.formula;render()}function checkAnswer(){if(S.selected===null)return;S.checked=true;const q=qs()[S.qi];if(S.selected===q.answer)S.score++;else S.wrong.push(q.original??S.qi);render()}
function nextQ(){const A=qs();if(S.qi<A.length-1){S.qi++;S.selected=null;S.checked=false;S.hint=false;S.formula=false;render();return}const bad=[...new Set(S.wrong)],D=P[S.course];if(S.review){const attempted=new Set(A.map(x=>x.original)),still=new Set(bad);D.wrong[S.setNo]=(D.wrong[S.setNo]||[]).filter(x=>!attempted.has(x)||still.has(x))}else{D.wrong[S.setNo]=bad;if(!bad.length&&!D.cleared.includes(S.setNo))D.cleared.push(S.setNo)}D.best[S.setNo]=Math.max(D.best[S.setNo]||0,S.score);save();S.finished=true;render()}
function renderResult(){const A=qs(),perfect=!S.wrong.length;app.innerHTML=`<main class="wrap center" style="padding-top:50px"><div class="card"><div style="font-size:58px">${perfect?'🏅':'🏆'}</div><b style="color:#047857">${S.review?'復習チャレンジ':sets()[S.setNo].title}</b><h1>${perfect?'クリア！':'よく考えました！'}</h1><div class="score">${S.score}<span style="font-size:22px;color:#94a3b8"> / ${A.length}</span></div>${S.wrong.length?`<p>復習したい問題：${S.wrong.map(x=>x+1).join('・')}</p>`:'<p style="color:#047857"><b>全問正解！「なぜ？」まで説明できたら完璧です。</b></p>'}<div class="row" style="justify-content:center"><button class="btn primary" onclick="openSet(${S.setNo},${S.review})">↻ もう一度</button><button class="btn" onclick="courseHome()">STEP一覧</button></div>${perfect&&!S.review&&S.setNo<sets().length-1?`<button class="btn wide" style="background:#0284c7;color:#fff" onclick="openSet(${S.setNo+1})">次のSTEPへ →</button>`:''}</div></main>`}
render();
</script></body></html>

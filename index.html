<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#059669"><title>場合の数トレーニング</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(#ecfdf5,#fff,#eff6ff);color:#1e293b;min-height:100vh}button{font:inherit;cursor:pointer}.wrap{max-width:760px;margin:auto;padding:18px}.hero{text-align:center;padding:24px 0}.hero h1{margin:6px 0;font-size:34px}.muted{color:#64748b}.card{background:white;border:1px solid #e2e8f0;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0f172a0c}.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left}.bubble{width:48px;height:48px;border-radius:16px;background:#d1fae5;color:#047857;display:grid;place-items:center;font-weight:900}.locked{opacity:.45}.done .bubble{background:#10b981;color:#fff}.grow{flex:1}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#10b981}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.choice{padding:16px;border:2px solid #e2e8f0;border-radius:16px;background:white;text-align:left;font-weight:800}.choice.sel{border-color:#10b981;background:#ecfdf5}.choice.good{border-color:#10b981;background:#ecfdf5}.choice.bad{border-color:#fb7185;background:#fff1f2}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800}.primary{background:#059669;color:white}.hint{background:#fffbeb;color:#92400e}.sky{background:#eff6ff;color:#075985}.review{background:#fef3c7}.box{padding:16px;border-radius:16px;margin-top:14px}.violet{background:#f5f3ff;color:#5b21b6}.result{text-align:center;padding-top:60px}.score{font-size:60px;font-weight:900;color:#059669}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.wide{width:100%;margin-top:18px;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.small{font-size:13px}.hidden{display:none}@media(max-width:540px){.choices{grid-template-columns:1fr}.hero h1{font-size:28px}.wrap{padding:12px}}
</style></head><body><div id="app"></div><script>
const steps=[{"title": "STEP 1 振り返り", "sub": "基本の数え方を思い出そう", "questions": [{"q": "赤・青・黄の3色のボールから1個を選びます。何通り？", "choices": ["2通り", "3通り", "6通り", "9通り"], "answer": 1, "hint": "選べるものを1つずつ書こう。", "formula": "3通り", "exp": "赤・青・黄の3つから1個なので3通り。まずは『もれなく数える』ことが基本です。", "check": "赤、青、黄、と全部言えたらOK！"}, {"q": "数字カード 2・5・8 から2枚を選んで並べ、2けたの整数を作ります。何通り？", "choices": ["3通り", "4通り", "6通り", "9通り"], "answer": 2, "hint": "十の位を決めたあと、一の位には何枚残る？", "formula": "3 × 2 ＝ 6通り", "exp": "十の位は3通り。1枚使うので一の位は2通り。3×2＝6通りです。順番が違えば別の整数です。", "check": "『3×2』の3と2が何を表すか説明しよう。"}, {"q": "数字カード 2・5・8 から2枚で作る2けたの整数のうち、偶数は何通り？", "choices": ["2通り", "3通り", "4通り", "6通り"], "answer": 2, "hint": "偶数になるかどうかは、どの位を見れば分かる？", "formula": "一の位2通り × 十の位2通り ＝ 4通り", "exp": "一の位は2か8の2通り。それぞれ十の位には残り2枚が使えるので2×2＝4通り。条件のある場所から先に決めるのがコツです。", "check": "なぜ一の位から考えたのか言ってみよう。"}]}, {"title": "STEP 2 並べ方の基本", "sub": "場所ごとの『何通り？』をかけ算にしよう", "questions": [{"q": "赤・青・黄・白の4枚のカードから2枚を選び、左から順に並べます。何通り？", "choices": ["6通り", "8通り", "12通り", "16通り"], "answer": 2, "hint": "1枚目は4通り。1枚使ったら残りは？", "formula": "4 × 3 ＝ 12通り", "exp": "1枚目は4通り、2枚目は残り3通り。4×3＝12通りです。1つ決めると使えるものが減ります。", "check": "4と3がそれぞれ何を表すか説明しよう。"}, {"q": "1・3・5・7の4枚から3枚を並べて3けたの整数を作ります。何通り？", "choices": ["12通り", "18通り", "24通り", "64通り"], "answer": 2, "hint": "百の位、十の位、一の位の順に考えよう。", "formula": "4 × 3 × 2 ＝ 24通り", "exp": "百の位4通り、十の位3通り、一の位2通りなので4×3×2＝24通りです。場所が3つでも同じ考え方です。", "check": "カードを1枚使うたびに、なぜ4→3→2と減る？"}, {"q": "A・B・C・Dの4人から、委員長1人と副委員長1人を選びます。何通り？", "choices": ["6通り", "8通り", "12通り", "16通り"], "answer": 2, "hint": "委員長と副委員長は役割が同じかな？", "formula": "4 × 3 ＝ 12通り", "exp": "委員長4通り、その人以外から副委員長3通り。役割が違うのでA→BとB→Aは別です。", "check": "『2人の代表を選ぶ』場合との違いを言ってみよう。"}]}, {"title": "STEP 3 条件のある並べ方", "sub": "決まりやすい場所から先に考えよう", "questions": [{"q": "2・5・6・8の4枚から3枚で3けたの整数を作ります。偶数は何通り？", "choices": ["6通り", "12通り", "18通り", "24通り"], "answer": 2, "hint": "偶数なら一の位は何が入る？", "formula": "一の位3 × 百の位3 × 十の位2 ＝ 18通り", "exp": "一の位は2・6・8の3通り。その後、百の位は残り3通り、十の位は2通り。3×3×2＝18通りです。", "check": "条件がある問題では、どこから考えると楽だった？"}, {"q": "2・5・6・8の4枚から3枚を並べるとき、5の倍数は何通り？", "choices": ["3通り", "6通り", "9通り", "12通り"], "answer": 1, "hint": "5の倍数の一の位は0か5。0のカードはある？", "formula": "1 × 3 × 2 ＝ 6通り", "exp": "一の位は5だけで1通り。残る3枚から百の位3通り、十の位2通りなので6通りです。", "check": "5の倍数を見分けるルールを言ってみよう。"}, {"q": "1・2・3・4のカードから3枚で3けたの整数を作ります。300より大きい整数は何通り？", "choices": ["6通り", "8通り", "12通り", "18通り"], "answer": 2, "hint": "300より大きくするには百の位は？", "formula": "百の位2 × 十の位3 × 一の位2 ＝ 12通り", "exp": "百の位は3か4の2通り。その後は残り3通り、2通り。2×3×2＝12通りです。", "check": "なぜ百の位を最初に決めたのか説明しよう。"}]}, {"title": "STEP 4 選び方と箱", "sub": "順番を区別するか見抜こう", "questions": [{"q": "赤・青・黄・白の4個のボールから2個を選びます。選ぶ順番は区別しません。何通り？", "choices": ["4通り", "6通り", "8通り", "12通り"], "answer": 1, "hint": "赤青と青赤は同じ選び方です。", "formula": "4 × 3 ÷ 2 ＝ 6通り", "exp": "順番をつけると12通りですが、同じ組を2回ずつ数えています。だから12÷2＝6通りです。", "check": "なぜ最後に2で割るのか、自分の言葉で説明しよう。"}, {"q": "赤・青・黄・白・黒の5色のボールから、大きな箱と小さな箱に1個ずつ入れます。同じボールは使いません。何通り？", "choices": ["10通り", "15通り", "20通り", "25通り"], "answer": 2, "hint": "大きな箱と小さな箱は区別します。", "formula": "5 × 4 ＝ 20通り", "exp": "大きな箱5通り、1個使ったあとの小さな箱4通り。箱が違うので入れ替えれば別です。", "check": "箱が同じ種類だったら考え方はどう変わりそう？"}, {"q": "5人から2人の代表を選びます。2人の役割に違いはありません。何通り？", "choices": ["5通り", "10通り", "15通り", "20通り"], "answer": 1, "hint": "代表A、代表Bという役割の違いはありません。", "formula": "5 × 4 ÷ 2 ＝ 10通り", "exp": "順番をつけると20通り。ただしA・BとB・Aは同じ組なので2で割り、10通りです。", "check": "委員長と副委員長なら、なぜ2で割らない？"}]}, {"title": "STEP 5 応用への入口", "sub": "場合分けして、複数の条件を整理しよう", "questions": [{"q": "0・2・5・8の4枚から3枚で3けたの整数を作ります。何通り？", "choices": ["12通り", "18通り", "24通り", "27通り"], "answer": 1, "hint": "百の位に0は置けません。", "formula": "百の位3 × 十の位3 × 一の位2 ＝ 18通り", "exp": "百の位は0以外で3通り。その後、十の位には0も使えるので残り3通り、一の位2通り。18通りです。", "check": "0がある問題で最初に注意することは？"}, {"q": "0・2・5・8から3枚で作る3けたの整数のうち、5の倍数は何通り？", "choices": ["6通り", "8通り", "10通り", "12通り"], "answer": 2, "hint": "一の位が0の場合と5の場合に分けよう。", "formula": "一の位0：3×2＝6　一の位5：2×2＝4　合計10通り", "exp": "一の位0なら6通り。一の位5なら百の位に0を置けないので4通り。6＋4＝10通りです。", "check": "なぜ『0の場合』『5の場合』に分けたのか説明しよう。"}, {"q": "1個のさいころを3回ふります。3回の目の合計が5になる出方は何通り？", "choices": ["3通り", "6通り", "9通り", "12通り"], "answer": 1, "hint": "合計5になる組を小さいものから探し、順番も考えよう。", "formula": "(1,1,3) が3通り ＋ (1,2,2) が3通り ＝ 6通り", "exp": "合計5の組は1・1・3と1・2・2。それぞれ異なる数字を置く場所が3通りあるので、3＋3＝6通りです。", "check": "『組を探す』と『順番を数える』の2段階を説明しよう。"}]}]; const KEY='kazu-training-standalone-v1';
let P;try{P=JSON.parse(localStorage.getItem(KEY))||{cleared:[],wrong:{},best:{}}}catch(e){P={cleared:[],wrong:{},best:{}}}
let state={step:null,i:0,selected:null,checked:false,hint:false,formula:false,review:false,score:0,wrong:[]};
const app=document.getElementById('app'); const save=()=>localStorage.setItem(KEY,JSON.stringify(P));
function qlist(){if(state.step===null)return[];if(!state.review)return steps[state.step].questions;return (P.wrong[state.step]||[]).map(n=>({...steps[state.step].questions[n],original:n}))}
function openStep(n,review=false){state={step:n,i:0,selected:null,checked:false,hint:false,formula:false,review,score:0,wrong:[]};render()}
function home(){state.step=null;render()}
function render(){if(state.step===null)return renderHome(); const qs=qlist(); if(state.finished)return renderResult(qs); const q=qs[state.i];
app.innerHTML=`<main class="wrap"><button class="btn" onclick="home()">⌂ STEP一覧</button><div class="top"><div><b style="color:#047857">${state.review?'復習：':''}${steps[state.step].title}</b><h2>${steps[state.step].sub}</h2></div><b>${state.i+1} / ${qs.length}</b></div><div class="bar"><div style="width:${((state.i+(state.checked?1:0))/qs.length)*100}%"></div></div><section class="card"><b style="color:#047857">✎ 問題 ${state.i+1}</b><h2>${q.q}</h2><div class="box" style="background:#f8fafc"><b>① 読む　② 紙に書く　③ 答える</b></div><div class="choices">${q.choices.map((c,j)=>`<button class="choice ${state.checked?(j===q.answer?'good':state.selected===j?'bad':''):state.selected===j?'sel':''}" ${state.checked?'disabled':''} onclick="pick(${j})">${c}</button>`).join('')}</div>${!state.checked?`<div class="row"><button class="btn hint" onclick="toggleHint()">💡 ヒント</button><button class="btn primary" ${state.selected===null?'disabled style="opacity:.4"':''} onclick="check()">答え合わせ</button></div>${state.hint?`<div class="box hint"><b>考えるヒント：</b> ${q.hint}</div>`:''}`:`<div class="box ${state.selected===q.answer?'review':'hint'}"><b>${state.selected===q.answer?'✓ 正解！':'△ おしい！'}</b><br>${state.selected===q.answer?'どうしてその式になるかも確認しよう。':`正解は「${q.choices[q.answer]}」。考え方を確認しよう！`}</div><button class="btn sky" style="margin-top:14px" onclick="toggleFormula()">式の立て方を見る</button>${state.formula?`<div class="box sky"><b>式・考え方</b><h3>${q.formula}</h3></div>`:''}<div class="box" style="background:#f8fafc"><b>📘 解説</b><p>${q.exp}</p></div><div class="box violet"><b>★ 仕上げのひとこと</b><p>${q.check}</p></div><button class="btn primary wide" onclick="next()">${state.i===qs.length-1?'結果を見る':'次の問題へ →'}</button>`}</section></main>`}
function renderHome(){const wrong=Object.values(P.wrong).reduce((a,b)=>a+b.length,0);app.innerHTML=`<main class="wrap"><header class="hero"><div style="font-size:42px">📗</div><b style="color:#047857">中学受験 算数</b><h1>場合の数 トレーニング</h1><p class="muted">基本 → 条件 → 場合分け。考え方を少しずつ育てよう。</p></header><div class="card"><b>学習の進み具合　<span style="float:right;color:#047857">${P.cleared.length} / ${steps.length} STEP</span></b><div class="bar" style="margin-top:12px"><div style="width:${P.cleared.length/steps.length*100}%"></div></div></div>${wrong?`<div class="card review"><b>🔄 今日の復習</b><p>前に間違えた問題をもう一度やってみよう。</p>${steps.map((s,n)=>(P.wrong[n]||[]).length?`<button class="btn" onclick="openStep(${n},true)">STEP ${n+1} を復習（${P.wrong[n].length}問）</button>`:'').join(' ')}</div>`:''}${steps.map((s,n)=>{const unlock=n===0||P.cleared.includes(n-1)||P.cleared.includes(n),done=P.cleared.includes(n);return`<button class="card step ${!unlock?'locked':''} ${done?'done':''}" ${!unlock?'disabled':''} onclick="openStep(${n})"><span class="bubble">${done?'✓':!unlock?'🔒':n+1}</span><span class="grow"><b style="font-size:19px">${s.title}</b><br><span class="muted">${s.sub}</span>${P.best[n]?`<br><span class="small muted">ベスト ${P.best[n]} / ${s.questions.length}</span>`:''}</span><b>›</b></button>`}).join('')}<div class="box violet"><b>おうちルール：</b> 答えを押す前に、紙に式か考え方を書く。正解したら「なぜ？」を1回声に出す。</div></main>`}
function pick(j){state.selected=j;render()} function toggleHint(){state.hint=!state.hint;render()} function toggleFormula(){state.formula=!state.formula;render()}
function check(){if(state.selected===null)return;state.checked=true;const q=qlist()[state.i];if(state.selected===q.answer)state.score++;else state.wrong.push(q.original??state.i);render()}
function next(){const qs=qlist();if(state.i<qs.length-1){state.i++;state.selected=null;state.checked=false;state.hint=false;state.formula=false;render();return}const wr=[...new Set(state.wrong)];if(state.review){const attempted=new Set(qs.map(x=>x.original));const bad=new Set(wr);P.wrong[state.step]=(P.wrong[state.step]||[]).filter(x=>!attempted.has(x)||bad.has(x))}else{P.wrong[state.step]=wr;if(wr.length===0&&!P.cleared.includes(state.step))P.cleared.push(state.step)}P.best[state.step]=Math.max(P.best[state.step]||0,state.score);save();state.finished=true;render()}
function renderResult(qs){const perfect=state.wrong.length===0;app.innerHTML=`<main class="wrap result"><div class="card"><div style="font-size:58px">${perfect?'🏅':'🏆'}</div><b style="color:#047857">${state.review?'復習チャレンジ':steps[state.step].title}</b><h1>${perfect?'クリア！':'よく考えました！'}</h1><div class="score">${state.score}<span style="font-size:22px;color:#94a3b8"> / ${qs.length}</span></div><p>${perfect?'全問正解！「なぜ？」まで言えたら本当に身についた証拠です。':'間違いは次に強くなるための印。あとでもう一度出てきます。'}</p><div class="row" style="justify-content:center"><button class="btn primary" onclick="openStep(${state.step},${state.review})">↻ もう一度</button><button class="btn" onclick="state.finished=false;home()">⌂ STEP一覧へ</button></div>${perfect&&!state.review&&state.step<steps.length-1?`<button class="btn wide" style="background:#0284c7;color:white" onclick="state.finished=false;openStep(${state.step+1})">次のSTEPへ →</button>`:''}</div></main>`}
render();
</script></body></html>
